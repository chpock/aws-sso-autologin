[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sso-autologin"
dynamic = ["version"]
description = "System tray app for automatic AWS SSO session refresh"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AWS SSO Autologin Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PySide6>=6.6.0",
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.6.0",
]

[project.scripts]
aws-sso-autologin = "aws_sso_autologin.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aws_sso_autologin*"]

[tool.setuptools.dynamic]
version = {attr = "aws_sso_autologin.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p pytester"
